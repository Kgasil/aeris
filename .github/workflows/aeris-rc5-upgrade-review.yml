name: Aeris exact RC4 to RC5 upgrade review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeris-rc5-upgrade-review.yml'
      - 'validation/installer/test-rc4-rc5-upgrade.ps1'
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Download and verify both exact historical artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'aeris-upgrade-exact'
          New-Item -ItemType Directory -Path $root | Out-Null
          $headers = @{Authorization=('Bearer ' + $env:GH_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          foreach ($r in @(@{version='rc4';id=15134209156;hash='34e010bb31a574211185f9b6729669c1b7a794856fdbbf10ae425b665aba6d8b'},@{version='rc5';id=15138829732;hash='09aa2076cac6f9bc8a543869027fe2617f0590fd4509a6f18261def0e797ba9a'})) {
            $zip = Join-Path $root ($r.version + '.zip')
            Invoke-WebRequest -Uri ('https://api.github.com/repos/Kgasil/aeris/actions/artifacts/' + $r.id + '/zip') -Headers $headers -OutFile $zip
            if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash -ne $r.hash) { throw 'Outer digest mismatch' }
            $out = Join-Path $root $r.version
            Expand-Archive -LiteralPath $zip -DestinationPath $out
          }
          $source = Join-Path $root 'rc5/security-evidence/Aeris-1.0.0rc5-integrated-source.zip'
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne 'fe393db2e8903ae9c181d23639729204bad96fefcbdc60de4c7cec2170debc18') { throw 'Source digest mismatch' }
          Expand-Archive -LiteralPath $source -DestinationPath (Join-Path $root 'source')
      - name: Test upgrade, leftover runtime inventory, clean reinstall and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'aeris-upgrade-exact'
          $python = (Get-Command python.exe).Source
          & .\validation\installer\test-rc4-rc5-upgrade.ps1 -OldSetup (Join-Path $root 'rc4/Aeris-1.0.0rc4-Windows-x64-Setup.exe') -OldSetupSha256 'eacbccd22ffeb8b2961fe838c321c61bc63445c08da6aea97b4ed3aa5e09452a' -OldExeSha256 '05272bdfa2be694cba686171a91a55d51c9ff014344b91ba33fe77a47be5b37e' -NewSetup (Join-Path $root 'rc5/Aeris-1.0.0rc5-Windows-x64-Setup.exe') -NewSetupSha256 '54ab3ab65672a32dc944259bb291f5c66ed735d4c5d5876641725131c9915aa8' -NewExeSha256 '4cb9ed45a6e9cce9c1f86a9d71e6f915aba987ab3532e034e34bd9300b7d0025' -Python $python -SourceDesktop (Join-Path $root 'source/desktop') -Validator (Join-Path $root 'source/distribution/validate-windows.ps1') -EvidenceDirectory upgrade-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-rc4-rc5-exact-upgrade-evidence
          path: upgrade-evidence/
          if-no-files-found: warn
          retention-days: 30
