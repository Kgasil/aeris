name: Aeris native Windows security validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeris-windows-native-security.yml'
      - 'validation/native-security/**'
permissions:
  contents: read
jobs:
  native-security:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Verify exact source archive and prepare native tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'downloads/Aeris-Desktop-v1.0.0rc1-fix1-codigo-fonte.zip'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '22e8843c3f823d4358766ad44905d5e13265cb47ab36dc10dbb42fc3760c9153') { throw 'Source hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath source
          New-Item -ItemType Directory -Path native-evidence | Out-Null
          $desktop = 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop'
          Copy-Item -LiteralPath validation/native-security/test_native_security.py -Destination (Join-Path $desktop 'tests/test_native_security.py')
          py -3.14-64 -c "import sys; assert sys.version_info[:3]==(3,14,10) and sys.platform=='win32' and sys.maxsize>2**32"
          if ($LASTEXITCODE -ne 0) { throw 'Expected Windows x64 Python 3.14.10' }
      - name: Execute native DPAPI and cross-process locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $PWD 'native-evidence/native-security.log'
          Push-Location 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop'
          try {
            py -3.14-64 -m unittest -v tests.test_native_security tests.test_vault.VaultTests.test_real_windows_dpapi tests.test_distribution.DistributionTests.test_native_mutex 2>&1 | Tee-Object -FilePath $log
            $exit = $LASTEXITCODE
            if ($exit -ne 0) { throw "Native security tests failed: $exit" }
            $text = Get-Content -LiteralPath $log -Raw
            if ($text -notmatch 'Ran 7 tests' -or $text -notmatch '(?m)^OK\s*$' -or $text -match 'skipped=') { throw 'Expected seven native tests with no skips' }
          } finally { Pop-Location }
          [pscustomobject]@{scope='Source-level native Windows APIs on Server 2022; same account only, not packaged app or client OS certification';tests=7;passed=7;dpapi_same_account_cross_process='PASS';dpapi_invalid_and_tamper='PASS';vault_native_roundtrip='PASS';mutex_cross_process='PASS';mutex_abrupt_exit_recovery='PASS';vault_cross_process_lock='PASS';other_account_dpapi='NOT_TESTED';ordinary_user_acl='NOT_TESTED';packaged_duplicate_instance='NOT_TESTED';release_approved=$false} | ConvertTo-Json | Set-Content -LiteralPath native-evidence/native-security.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-native-security-evidence
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 30
