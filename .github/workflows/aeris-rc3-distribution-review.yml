name: Aeris RC3 distribution review (no publish)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeris-rc3-distribution-review.yml'
      - 'validation/release/compare-microsoft-redist.ps1'
permissions:
  contents: read
  actions: read
jobs:
  clamav:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Retrieve and verify exact RC3 bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p scan-evidence
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/Kgasil/aeris/actions/artifacts/15132444366/zip -o "$RUNNER_TEMP/rc3.zip"
          python validation/verify-ci-artifact.py "$RUNNER_TEMP/rc3.zip" --expected-sha256 de81221a8723a9c26f11db293e440c65243f4c4c53e8d2dd2d00afc0e94e270f > scan-evidence/integrity.json
          python validation/performance/extract-rc3.py "$RUNNER_TEMP/rc3.zip" "$RUNNER_TEMP/rc3-portable" > scan-evidence/portable-integrity.json
          mkdir "$RUNNER_TEMP/rc3-assets"
          for name in Aeris-1.0.0rc3-Windows-x64-Setup.exe Aeris-1.0.0rc3-Windows-x64-portable.zip; do
            unzip -p "$RUNNER_TEMP/rc3.zip" "$name" > "$RUNNER_TEMP/rc3-assets/$name"
          done
          cd "$RUNNER_TEMP/rc3-assets"
          printf '%s\n' 'cd2416ff0530b63f186d9363eb2f974b40f27ba5e6f41a22e63540034d96ac0a  Aeris-1.0.0rc3-Windows-x64-Setup.exe' '4f8a6b6cdba4f4b4e43e5547d57cf48012c66f93cb72628c2a1fb7002a58cb23  Aeris-1.0.0rc3-Windows-x64-portable.zip' | sha256sum -c -
      - name: Install scanner and fetch current definitions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav clamav-freshclam
          # Do not race the package's updater or weaken the freshness gate.
          if systemctl is-active --quiet clamav-freshclam; then
            for i in $(seq 1 12); do
              sudo journalctl -u clamav-freshclam --no-pager -n 100 > scan-evidence/freshclam.log
              if grep -Ei 'daily\.(cvd|cld).*(up.to.date|updated)' scan-evidence/freshclam.log; then break; fi
              sleep 5
            done
          else
            sudo freshclam --stdout 2>&1 | tee scan-evidence/freshclam.log
          fi
          clamscan --database=/var/lib/clamav --version | tee scan-evidence/version.txt
          daily=$(find /var/lib/clamav -maxdepth 1 \( -name daily.cvd -o -name daily.cld \) -print -quit)
          test -n "$daily"
          sigtool --info "$daily" | tee scan-evidence/daily-info.txt
          grep -F 'Verification OK.' scan-evidence/daily-info.txt
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, re
          line = re.search(r"(?m)^Build time:\s*(.+)$", Path("scan-evidence/daily-info.txt").read_text())
          if not line:
              raise SystemExit("Missing database build time")
          raw = line.group(1).strip()
          parsed = datetime.strptime(raw, "%d %b %Y %H:%M %z")
          age = (datetime.now(timezone.utc)-parsed.astimezone(timezone.utc)).total_seconds()
          ok = 0 <= age <= 86400
          Path("scan-evidence/definition-freshness.json").write_text(json.dumps({"build_utc": parsed.isoformat(), "age_seconds": round(age), "fresh": ok, "max_age_seconds": 86400, "release_approved": False}, indent=2))
          if not ok:
              raise SystemExit("Daily definitions not within 24 hours; scan blocked")
          PY
      - name: Scan exact installer, archive and verified extracted portable files
        shell: bash
        run: |
          set -euo pipefail
          # Do not execute binaries, submit samples, remove detections, or modify the artifacts.
          clamscan --database=/var/lib/clamav --recursive=yes --scan-archive=yes --alert-exceeds-max=yes --max-filesize=100M --max-scansize=400M --max-files=20000 --max-recursion=30 "$RUNNER_TEMP/rc3-assets" "$RUNNER_TEMP/rc3-portable" 2>&1 | tee scan-evidence/clamav-scan.log
          grep -E '^Infected files: 0$' scan-evidence/clamav-scan.log
          if grep -Ei '(^|[[:space:]])(ERROR|FOUND)([[:space:]]|$)' scan-evidence/clamav-scan.log; then exit 1; fi
          python validation/verify-ci-artifact.py "$RUNNER_TEMP/rc3.zip" --expected-sha256 de81221a8723a9c26f11db293e440c65243f4c4c53e8d2dd2d00afc0e94e270f > scan-evidence/post-scan-integrity.json
          cd "$RUNNER_TEMP/rc3-assets"
          printf '%s\n' 'cd2416ff0530b63f186d9363eb2f974b40f27ba5e6f41a22e63540034d96ac0a  Aeris-1.0.0rc3-Windows-x64-Setup.exe' '4f8a6b6cdba4f4b4e43e5547d57cf48012c66f93cb72628c2a1fb7002a58cb23  Aeris-1.0.0rc3-Windows-x64-portable.zip' | sha256sum -c -
          printf '%s\n' '{"status":"SCAN_COMPLETED_REVIEW_REQUIRED","scanner":"ClamAV","scope":"exact RC3 installer and portable archive plus extracted portable files","defender_client":"NOT_TESTED","release_approved":false}' > "$GITHUB_WORKSPACE/scan-evidence/status.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-rc3-clamav-evidence
          path: scan-evidence/
          if-no-files-found: warn
          retention-days: 30
  windows-origin:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Verify exact RC3 portable files without executing them
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path origin-evidence | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'aeris-rc3-review.zip'
          $target = Join-Path $env:RUNNER_TEMP 'aeris-rc3-review'
          $headers = @{Authorization=('Bearer ' + $env:GH_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri 'https://api.github.com/repos/Kgasil/aeris/actions/artifacts/15132444366/zip' -Headers $headers -OutFile $archive
          py -3.14-64 validation/performance/extract-rc3.py $archive $target | Set-Content -LiteralPath origin-evidence/integrity.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'RC3 integrity failed' }
          & .\validation\release\compare-microsoft-redist.ps1 -Bundle (Join-Path $target 'Aeris') -EvidencePath origin-evidence/microsoft-redist-comparison.json
      - name: Record Defender status without changing security settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureVersion,AntivirusSignatureLastUpdated,AMEngineVersion | ConvertTo-Json | Set-Content -LiteralPath origin-evidence/defender-status.json -Encoding utf8
          } catch {
            '{"status":"NOT_AVAILABLE","release_approved":false}' | Set-Content -LiteralPath origin-evidence/defender-status.json -Encoding utf8
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-rc3-microsoft-origin-evidence
          path: origin-evidence/
          if-no-files-found: warn
          retention-days: 30
