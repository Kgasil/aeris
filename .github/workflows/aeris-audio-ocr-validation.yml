name: Aeris audio and OCR validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeris-audio-ocr-validation.yml'
      - 'validation/audio-ocr/**'
permissions:
  contents: read
jobs:
  real-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Install optional OCR engine and language data from signed Ubuntu packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ocr-evidence
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-spa
          dpkg-query -W tesseract-ocr tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-spa > ocr-evidence/packages.txt
          /usr/bin/tesseract --version > ocr-evidence/engine.txt
          /usr/bin/tesseract --list-langs > ocr-evidence/languages.txt
          for lang in eng por spa; do grep -Fx "$lang" ocr-evidence/languages.txt; done
      - name: Execute actual Aeris OCR on PNG and JPEG fixtures
        shell: bash
        run: |
          set -euo pipefail
          echo '22e8843c3f823d4358766ad44905d5e13265cb47ab36dc10dbb42fc3760c9153  downloads/Aeris-Desktop-v1.0.0rc1-fix1-codigo-fonte.zip' | sha256sum -c -
          unzip -q downloads/Aeris-Desktop-v1.0.0rc1-fix1-codigo-fonte.zip -d source
          cd source/Aeris-Desktop-v1.0.0rc1-fix1/desktop
          python -m unittest -v tests.test_lens 2>&1 | tee "$GITHUB_WORKSPACE/ocr-evidence/ocr.log"
          grep -E '^test_real_ocr .* \.\.\. ok$' "$GITHUB_WORKSPACE/ocr-evidence/ocr.log"
          grep -E '^Ran 6 tests' "$GITHUB_WORKSPACE/ocr-evidence/ocr.log"
          if grep -E 'skipped=' "$GITHUB_WORKSPACE/ocr-evidence/ocr.log"; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-real-ocr-evidence
          path: ocr-evidence/
          if-no-files-found: warn
          retention-days: 30
  native-speech:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Verify native voice enumeration and permission regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'downloads/Aeris-Desktop-v1.0.0rc1-fix1-codigo-fonte.zip'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '22e8843c3f823d4358766ad44905d5e13265cb47ab36dc10dbb42fc3760c9153') { throw 'Source hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath source
          New-Item -ItemType Directory -Path speech-evidence | Out-Null
          $log = Join-Path $PWD 'speech-evidence/voice.log'
          Push-Location 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop'
          try {
            py -3.14-64 -m unittest -v tests.test_voice tests.test_pronounce tests.test_permissions 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw 'Voice regression failed' }
            $s = Get-Content -LiteralPath $log -Raw
            if ($s -notmatch 'Ran 14 tests' -or $s -notmatch 'test_native_voice_enumeration[^\r\n]*\.\.\. ok' -or $s -match 'skipped=') { throw 'Expected fourteen tests with native enumeration and no skips' }
          } finally { Pop-Location }
      - name: Synthesize real native speech into synthetic WAV without audio device
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\validation\audio-ocr\test-speech-wave.ps1 -EvidenceDirectory speech-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-native-speech-evidence
          path: speech-evidence/
          if-no-files-found: warn
          retention-days: 30
