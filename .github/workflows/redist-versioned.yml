name: K&G exact versioned Microsoft redistributable evidence
on:
  push:
    branches: [development/native-source-preflight]
    paths: ['.github/workflows/redist-versioned.yml','validation/redist-versioned.ps1']
permissions:
  contents: read
jobs:
  exact-redist:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Verify official versioned package and compare DLLs
        shell: pwsh
        run: ./validation/redist-versioned.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kgvision-versioned-redist-evidence
          path: redist-evidence/
          if-no-files-found: warn
          retention-days: 14
