name: Aeris Windows RC1 to RC2 upgrade and recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeris-windows-upgrade-recovery.yml'
      - 'validation/installer/test-upgrade-recovery.ps1'
permissions:
  contents: read
  actions: read
concurrency:
  group: aeris-windows-upgrade-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer-preview:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Verify and unpack source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'downloads/Aeris-Desktop-v1.0.0rc1-fix1-codigo-fonte.zip'
          $expected = '22e8843c3f823d4358766ad44905d5e13265cb47ab36dc10dbb42fc3760c9153'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Source hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath source
          py -3.14-64 -c "import tkinter, sys, ssl; assert sys.version_info[:3] == (3,14,10) and sys.maxsize > 2**32; print(sys.version); print(ssl.OPENSSL_VERSION); assert ssl.OPENSSL_VERSION_INFO[:2] >= (3,5)"
          if ($LASTEXITCODE -ne 0) { throw 'Python x64 verification failed' }
      - name: Apply tested regression-test compatibility update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = 'validation/test_verify.py'
          if ((Get-FileHash -LiteralPath $test -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd54b0258a08369b29559a12275e9071098dd9c750a9d6e2802892691ba3b06ef') { throw 'Regression test hash mismatch' }
          Copy-Item -LiteralPath $test -Destination 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop/tests/test_verify.py' -Force
      - name: Fix catalog resource path in build recipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'source/Aeris-Desktop-v1.0.0rc1-fix1/distribution/build.ps1'
          $original = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $path).Path)
          $old = "'--add-data','aeris/catalog.json:aeris'"
          $new = "'--add-data',((Join-Path `$desktop 'aeris/catalog.json') + ':aeris')"
          if ([regex]::Matches($original, [regex]::Escape($old)).Count -ne 1) { throw 'Unexpected build recipe' }
          [IO.File]::WriteAllText((Resolve-Path -LiteralPath $path).Path, $original.Replace($old,$new), [Text.UTF8Encoding]::new($false))
          if (-not (Test-Path -LiteralPath 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop/aeris/catalog.json' -PathType Leaf)) { throw 'Missing source catalog' }
      - name: Apply simplified installer recipe and verify preserved invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = 'source/Aeris-Desktop-v1.0.0rc1-fix1/distribution/Aeris.iss'
          $overlay = 'validation/installer/Aeris.iss'
          $before = Get-Content -LiteralPath $original
          $after = Get-Content -LiteralPath $overlay
          foreach ($key in @('AppId','AppName','DefaultDirName','PrivilegesRequired','AppMutex','CloseApplications','RestartApplications','ArchitecturesAllowed','ArchitecturesInstallIn64BitMode','MinVersion','InfoBeforeFile','OutputBaseFilename','UninstallDisplayIcon')) {
            $a = @($before | Where-Object { $_ -match ('^' + $key + '=') })
            $b = @($after | Where-Object { $_ -match ('^' + $key + '=') })
            if ($a.Count -ne 1 -or $b.Count -ne 1 -or $a[0] -cne $b[0]) { throw "Installer invariant changed: $key" }
          }
          if ($after -match '^\[(Registry|InstallDelete|UninstallDelete|UninstallRun)\]$') { throw 'Unexpected installer side effects' }
          $run = @($after | Where-Object { $_ -match '^Filename: ' })
          if ($run.Count -ne 1 -or $run[0] -notmatch 'Flags: postinstall nowait skipifsilent unchecked runasoriginaluser$') { throw 'Unexpected launch behavior' }
          Copy-Item -LiteralPath $overlay -Destination $original -Force
      - name: Adapt verified build recipe for patched runtime candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'source/Aeris-Desktop-v1.0.0rc1-fix1/distribution'
          $build = Join-Path $root 'build.ps1'
          $s = [IO.File]::ReadAllText((Resolve-Path $build).Path)
          if ([regex]::Matches($s, '-3\.12-64').Count -ne 2 -or -not $s.Contains('(3,12)')) { throw 'Unexpected runtime recipe' }
          $s = $s.Replace('-3.12-64','-3.14-64').Replace('(3,12)','(3,14)').Replace('CPython 3.12','CPython 3.14')
          [IO.File]::WriteAllText((Resolve-Path $build).Path,$s,[Text.UTF8Encoding]::new($false))
          $validator = Join-Path $root 'validate-windows.ps1'
          $v = [IO.File]::ReadAllText((Resolve-Path $validator).Path)
          if ([regex]::Matches($v,'python312\.dll').Count -ne 1) { throw 'Unexpected validator' }
          [IO.File]::WriteAllText((Resolve-Path $validator).Path,$v.Replace('python312.dll','python314.dll'),[Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Path security-evidence | Out-Null
          py -3.14-64 -c "import sys, ssl, tkinter, json; t=tkinter.Tcl(); print(json.dumps(dict(python=sys.version,openssl=ssl.OPENSSL_VERSION,tcl=t.eval('info patchlevel'))))" | Set-Content -LiteralPath security-evidence/runtime.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Runtime inventory failed' }
      - name: Preserve strict Timeline date and time validation on Python 3.14
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop/aeris/timeline.py'
          $s = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $path).Path)
          $old = "r'[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}'"
          $new = "r'[0-9]{4}-[0-9]{2}-[0-9]{2} (?:[01][0-9]|2[0-3]):[0-5][0-9]'"
          if ([regex]::Matches($s,[regex]::Escape($old)).Count -ne 1) { throw 'Unexpected Timeline implementation' }
          [IO.File]::WriteAllText((Resolve-Path -LiteralPath $path).Path,$s.Replace($old,$new),[Text.UTF8Encoding]::new($false))
          Push-Location 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop'
          try {
            py -3.14-64 -m unittest tests.test_timeline -v
            if ($LASTEXITCODE -ne 0) { throw 'Timeline regression failed' }
            py -3.14-64 -c "from aeris.timeline import parse_when; assert parse_when('2026-11-25 00:00').hour == 0; assert parse_when('2026-11-25 23:59').minute == 59"
            if ($LASTEXITCODE -ne 0) { throw 'Timeline valid boundary regression failed' }
          } finally { Pop-Location }
      - name: Upgrade pinned PyInstaller for embedded Tcl Tk 9 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'source/Aeris-Desktop-v1.0.0rc1-fix1/distribution/requirements-build.txt'
          $s = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $path).Path)
          $pattern = '(?im)^(\s*pyinstaller\s*==\s*)6\.19\.0(?=\s*(?:#|$))'
          if ([regex]::Matches($s,$pattern).Count -ne 1) { throw 'Unexpected PyInstaller pin; review requirements' }
          $s = [regex]::Replace($s,$pattern,'pyinstaller==6.22.3')
          [IO.File]::WriteAllText((Resolve-Path -LiteralPath $path).Path,$s,[Text.UTF8Encoding]::new($false))
          Copy-Item -LiteralPath $path -Destination security-evidence/requirements-build.txt
      - name: Align portable release verification with Python 3.14 DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop'
          $path = Join-Path $root 'aeris/release_check.py'
          $s = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $path).Path)
          if ([regex]::Matches($s,'python312\.dll').Count -ne 2) { throw 'Unexpected release verifier' }
          [IO.File]::WriteAllText((Resolve-Path -LiteralPath $path).Path,$s.Replace('python312.dll','python314.dll'),[Text.UTF8Encoding]::new($false))
          $test = Join-Path $root 'tests/test_release_check.py'
          $t = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $test).Path)
          $marker = '    def test_path_rejection(self):'
          if ([regex]::Matches($t,[regex]::Escape($marker)).Count -ne 1) { throw 'Unexpected release test suite' }
          $extra = @'
          def test_runtime_dll_required(self):
              (self.bundle / '_internal' / 'python314.dll').unlink()
              with self.assertRaises(ValueError):
                  build_portable(self.bundle, self.zip)
              self.assertFalse(self.zip.exists())

          def test_runtime_dll_architecture(self):
              (self.bundle / '_internal' / 'python314.dll').write_bytes(fake_pe(0x14c))
              with self.assertRaises(ValueError):
                  build_portable(self.bundle, self.zip)
              self.assertFalse(self.zip.exists())

          '@
          $extra = (($extra -split '\r?\n') | ForEach-Object { '    ' + $_ }) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Resolve-Path -LiteralPath $test).Path,$t.Replace($marker,$extra + [Environment]::NewLine + $marker),[Text.UTF8Encoding]::new($false))
          Push-Location $root
          try {
            py -3.14-64 -m unittest tests.test_release_check -v
            if ($LASTEXITCODE -ne 0) { throw 'Release verifier regression failed' }
          } finally { Pop-Location }
      - name: Download and verify official pinned Inno Setup 6.7.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
          $expected = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'Aeris-Inno-6.7.4'
          if (Test-Path -LiteralPath $dir) { throw 'Expected fresh compiler directory' }
          Invoke-WebRequest -Uri $url -OutFile $download
          if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Inno Setup vendor download hash mismatch' }
          $sig = Get-AuthenticodeSignature -LiteralPath $download
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '(?i)CN=Pyrsys B\.V\.(,|$)') { throw 'Inno Setup publisher signature not verified' }
          [pscustomobject]@{version='6.7.4';url=$url;sha256=$expected;signature=$sig.Status.ToString();publisher=$sig.SignerCertificate.Subject} | ConvertTo-Json | Set-Content -LiteralPath security-evidence/compiler-download.json -Encoding utf8
          $log = Join-Path $PWD 'security-evidence/compiler-install.log'
          $p = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="' + $dir + '"'),('/LOG="' + $log + '"')) -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw 'Compiler installation timed out' }
          if ($p.ExitCode -ne 0) { throw "Compiler installation exit code $($p.ExitCode)" }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) { throw 'Pinned compiler missing' }
          if ((Get-AuthenticodeSignature -LiteralPath $iscc).Status -ne 'Valid') { throw 'Compiler signature not valid' }
          $license = Join-Path $dir 'LICENSE.TXT'
          if (-not (Test-Path -LiteralPath $license -PathType Leaf)) { throw 'Compiler license missing' }
          Copy-Item -LiteralPath $license -Destination security-evidence/InnoSetup-LICENSE.txt
          "AERIS_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Include collected upstream notices in candidate before packing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'source/Aeris-Desktop-v1.0.0rc1-fix1/distribution/build.ps1'
          $s = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $path).Path)
          $marker = '    Invoke-Checked $python @((Join-Path $PSScriptRoot ''collect-notices.py''),$notices)'
          if ([regex]::Matches($s,[regex]::Escape($marker)).Count -ne 1) { throw 'Unexpected notice collection recipe' }
          $extra = @'
              $reviewNotices = Join-Path $env:GITHUB_WORKSPACE 'validation/third-party-notices'
              $expectedNotices = @('OpenSSL-3.5.9.txt','bzip2-1.0.8.txt','libffi-3.4.4.txt','XZ-5.2.5.txt','XZ-5.2.5-COPYING.LGPLv2.1.txt','Zstandard-1.5.7.txt','zlib-ng-2.2.4.txt','zlib-1.3.2.txt','mpdecimal-4.0.0.txt','libexpat.txt','libtommath-tcl-9.0.4.txt','Unicode-16.0.0.txt')
              foreach ($name in $expectedNotices) {
                  $notice = Join-Path $reviewNotices $name
                  if (-not (Test-Path -LiteralPath $notice -PathType Leaf)) { throw "Missing reviewed upstream notice: $name" }
                  Copy-Item -LiteralPath $notice -Destination $notices
              }
              Copy-Item -LiteralPath (Join-Path (Split-Path -Parent $Iscc) 'LICENSE.TXT') -Destination (Join-Path $notices 'InnoSetup-6.7.4.txt')
          '@
          [IO.File]::WriteAllText((Resolve-Path -LiteralPath $path).Path,$s.Replace($marker,$marker + [Environment]::NewLine + $extra),[Text.UTF8Encoding]::new($false))
      - name: Prepare distinct RC2 upgrade candidate without modifying source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'source/Aeris-Desktop-v1.0.0rc1-fix1'
          $version = Join-Path $root 'desktop/aeris/__init__.py'
          $s = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $version).Path)
          if ($s.Trim() -cne '__version__ = "1.0.0rc1"') { throw 'Unexpected source version' }
          [IO.File]::WriteAllText((Resolve-Path -LiteralPath $version).Path,$s.Replace('1.0.0rc1','1.0.0rc2'),[Text.UTF8Encoding]::new($false))
          $gate = Join-Path $root 'distribution/release-gate.json'
          $g = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $gate).Path)
          if ([regex]::Matches($g,'1\.0\.0rc1').Count -ne 1) { throw 'Unexpected release gate version' }
          [IO.File]::WriteAllText((Resolve-Path -LiteralPath $gate).Path,$g.Replace('1.0.0rc1','1.0.0rc2'),[Text.UTF8Encoding]::new($false))
          $preview = Join-Path $root 'distribution/PREVIEW.txt'
          Add-Content -LiteralPath $preview -Encoding utf8 -Value @'

          RC2 EXPERIMENTAL - upgrade and recovery validation only.
          Before updating, close Aeris and keep a protected backup of %LOCALAPPDATA%\Aeris.
          Do not automatically downgrade; use the verified previous installer only after reviewing data compatibility.
          This candidate does not introduce automatic updates or migrate the data schema.
          '@
      - name: Build with verified Inno Setup 6.7.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:AERIS_ISCC -PathType Leaf)) { throw 'Pinned compiler unavailable' }
          & .\source\Aeris-Desktop-v1.0.0rc1-fix1\distribution\build.ps1 -Iscc $env:AERIS_ISCC
      - name: Verify exact prior artifact and test RC1 to RC2 upgrade and recovery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'source/Aeris-Desktop-v1.0.0rc1-fix1'
          $dirs = @(Get-ChildItem -LiteralPath "$root/distribution/out" -Directory)
          if ($dirs.Count -ne 1) { throw 'Expected exactly one RC2 build' }
          $stage = $dirs[0].FullName
          $exe = Join-Path $stage 'dist/Aeris/Aeris.exe'
          $hash = (Get-Content -LiteralPath (Join-Path $stage 'AERIS-EXE-SHA256.txt') -Raw).Trim()
          $validator = (Resolve-Path -LiteralPath "$root/distribution/validate-windows.ps1").Path
          New-Item -ItemType Directory -Path preview-evidence | Out-Null
          & $validator -AerisExe $exe -ExpectedExeSha256 $hash -Mode Portable -ConfirmTestVM | Set-Content -LiteralPath preview-evidence/portable-validation.json -Encoding utf8
          $oldZip = Join-Path $env:RUNNER_TEMP 'aeris-rc1-exact-artifact.zip'
          $oldSetup = Join-Path $env:RUNNER_TEMP 'Aeris-1.0.0rc1-Windows-x64-Setup.exe'
          $headers = @{Authorization=('Bearer ' + $env:GH_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri 'https://api.github.com/repos/Kgasil/aeris/actions/artifacts/15132975671/zip' -Headers $headers -OutFile $oldZip
          if ((Get-FileHash -LiteralPath $oldZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '344312b886942c379be7010df852da5d92812f8487ca4cf9698d5987d3b7701f') { throw 'Prior artifact digest mismatch' }
          py -3.14-64 -c "import zipfile,sys,pathlib; z=zipfile.ZipFile(sys.argv[1]); n='Aeris-1.0.0rc1-Windows-x64-Setup.exe'; assert z.namelist().count(n)==1; pathlib.Path(sys.argv[2]).write_bytes(z.read(n))" $oldZip $oldSetup
          if ($LASTEXITCODE -ne 0) { throw 'Prior setup extraction failed' }
          $oldSetupHash = '0f3e0a21919f5944f45301c1f589e5f1665e3a608c5abd39d4a618677ac46407'
          $oldExeHash = 'ed8aa796b948b658dcc9ef97469512b9264240d56efadbb5e555091a5366849c'
          $newSetup = Join-Path $stage 'Aeris-1.0.0rc2-Windows-x64-Setup.exe'
          $newHash = (Get-FileHash -LiteralPath $newSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\validation\installer\test-upgrade-recovery.ps1 -OldSetup $oldSetup -OldSetupSha256 $oldSetupHash -OldExeSha256 $oldExeHash -NewSetup $newSetup -NewSetupSha256 $newHash -NewExeSha256 $hash -Python (Join-Path $stage 'venv/Scripts/python.exe') -SourceDesktop (Resolve-Path -LiteralPath "$root/desktop").Path -Validator $validator -EvidenceDirectory preview-evidence/upgrade
          foreach ($name in @('Aeris-1.0.0rc2-Windows-x64-portable.zip','Aeris-1.0.0rc2-Windows-x64-Setup.exe','SHA256SUMS.txt','AERIS-EXE-SHA256.txt','build-dependencies.txt')) {
            Copy-Item -LiteralPath (Join-Path $stage $name) -Destination preview-evidence
          }
      - name: Verify portable manifest and record inventory
        shell: pwsh
        run: |
          py -3.14-64 validation/audit-desktop-bundle.py preview-evidence/Aeris-1.0.0rc2-Windows-x64-portable.zip --output preview-evidence/bundle-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Bundle inventory verification failed' }
      - name: Record actual bundle binary provenance and available scanner status
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'source/Aeris-Desktop-v1.0.0rc1-fix1/distribution/out'
          $stage = @(Get-ChildItem -LiteralPath $root -Directory)
          if ($stage.Count -ne 1) { throw 'Expected one candidate' }
          $bundle = Join-Path $stage[0].FullName 'dist/Aeris'
          $files = Get-ChildItem -LiteralPath $bundle -File -Recurse | Where-Object { $_.Extension -in '.exe','.dll','.pyd' }
          $inventory = foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file.FullName
            [pscustomobject]@{ path=$file.FullName.Substring($bundle.Length+1); version=$file.VersionInfo.FileVersion; company=$file.VersionInfo.CompanyName; sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); signature=$sig.Status.ToString(); signer=if($sig.SignerCertificate){$sig.SignerCertificate.Subject}else{''} }
          }
          $inventory | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath security-evidence/binary-inventory.json -Encoding utf8
          $compiler = $env:AERIS_ISCC
          if ($compiler) {
            $item=Get-Item -LiteralPath $compiler
            [pscustomobject]@{version=$item.VersionInfo.FileVersion;sha256=(Get-FileHash -LiteralPath $compiler).Hash;signature=(Get-AuthenticodeSignature -LiteralPath $compiler).Status.ToString()} | ConvertTo-Json | Set-Content -LiteralPath security-evidence/compiler.json -Encoding utf8
            $license = Join-Path $item.DirectoryName 'LICENSE.TXT'
            if (Test-Path -LiteralPath $license) { Copy-Item -LiteralPath $license -Destination security-evidence/InnoSetup-LICENSE.txt }
          }
          try {
            if (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) {
              Get-MpComputerStatus | Select-Object AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureVersion,AntivirusSignatureLastUpdated,AMProductVersion | ConvertTo-Json | Set-Content -LiteralPath security-evidence/defender-status.json -Encoding utf8
            }
          } catch { Write-Warning 'Defender status unavailable' }
          [pscustomobject]@{malware_scan='NOT_TESTED';release_approved=$false;scope='Inventory and compatibility candidate only; scanner availability is not a scan'} | ConvertTo-Json | Set-Content -LiteralPath security-evidence/trust-status.json -Encoding utf8
          Copy-Item -LiteralPath security-evidence -Destination preview-evidence/security-evidence -Recurse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aeris-rc2-upgrade-recovery-not-a-release
          path: preview-evidence/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: aeris-upgrade-failure-diagnostics
          path: |
            preview-evidence/
            security-evidence/
          if-no-files-found: ignore
          retention-days: 7
