name: Aeris local AI validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeris-local-ai-validation.yml'
      - 'validation/local-ai/**'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Validate local transport and permissions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'downloads/Aeris-Desktop-v1.0.0rc1-fix1-codigo-fonte.zip'
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '22e8843c3f823d4358766ad44905d5e13265cb47ab36dc10dbb42fc3760c9153') { throw 'Source hash mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath source
          New-Item -ItemType Directory -Path ai-evidence | Out-Null
          $log = Join-Path $PWD 'ai-evidence/protocol.log'
          $desktop = 'source/Aeris-Desktop-v1.0.0rc1-fix1/desktop'
          Copy-Item -LiteralPath validation/local-ai/test_loopback.py -Destination (Join-Path $desktop 'tests/test_loopback.py')
          Push-Location $desktop
          try {
            py -3.14-64 -m unittest -v tests.test_loopback tests.test_companion tests.test_copilot tests.test_permissions tests.test_local_worker 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw 'Protocol tests failed' }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-local-ai-protocol-evidence
          path: ai-evidence/
          if-no-files-found: warn
          retention-days: 30
  real-ollama:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Verify source and download exact official Ollama runtime
        shell: bash
        run: |
          set -euo pipefail
          echo '22e8843c3f823d4358766ad44905d5e13265cb47ab36dc10dbb42fc3760c9153  downloads/Aeris-Desktop-v1.0.0rc1-fix1-codigo-fonte.zip' | sha256sum -c -
          unzip -q downloads/Aeris-Desktop-v1.0.0rc1-fix1-codigo-fonte.zip -d source
          mkdir -p ai-evidence "$RUNNER_TEMP/aeris-ollama"
          curl --fail --location --silent --show-error --retry 2 --max-time 900 \
            'https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-linux-amd64.tar.zst' -o "$RUNNER_TEMP/ollama.tar.zst"
          echo "b82649006cb5b54ed1237fa2d1a26a7f939a4fd03150033759acbff7ff315adf  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/aeris-ollama"
          test -x "$RUNNER_TEMP/aeris-ollama/bin/ollama"
      - name: Run genuine local model inference and failure tests
        shell: bash
        env:
          OLLAMA_HOST: '127.0.0.1:11434'
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_MAX_LOADED_MODELS: '1'
          OLLAMA_NUM_PARALLEL: '1'
          CUDA_VISIBLE_DEVICES: '-1'
          HIP_VISIBLE_DEVICES: '-1'
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/aeris-models"
          export HOME="$RUNNER_TEMP/aeris-ollama-home"
          mkdir -p "$OLLAMA_MODELS" "$HOME"
          ollama="$RUNNER_TEMP/aeris-ollama/bin/ollama"
          if curl -fsS --max-time 2 http://127.0.0.1:11434/api/version; then
            echo 'Unexpected existing service'; exit 1
          fi
          "$ollama" serve > "$GITHUB_WORKSPACE/ai-evidence/ollama-server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/version > ai-evidence/version.json; then break; fi
            kill -0 "$server"
            sleep 1
          done
          python -c 'import json; assert json.load(open("ai-evidence/version.json"))["version"]=="0.40.18"'
          "$ollama" pull smollm2:135m
          curl -fsS http://127.0.0.1:11434/api/tags > ai-evidence/model-tags.json
          python -c 'import json; m=json.load(open("ai-evidence/model-tags.json"))["models"]; assert len(m)==1 and m[0]["name"]=="smollm2:135m" and m[0]["digest"].startswith("9077fe9d2ae1"), "Unexpected model digest"'
          export PYTHONPATH="$GITHUB_WORKSPACE/source/Aeris-Desktop-v1.0.0rc1-fix1/desktop"
          python validation/local-ai/real_inference.py online ai-evidence/real-inference.json
          kill "$server"
          wait "$server" || true
          trap - EXIT
          python validation/local-ai/real_inference.py offline ai-evidence/service-unavailable.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-real-ollama-evidence
          path: ai-evidence/
          if-no-files-found: warn
          retention-days: 30
