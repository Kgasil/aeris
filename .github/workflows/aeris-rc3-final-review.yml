name: Aeris exact RC3 final performance review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aeris-rc3-final-review.yml'
      - 'validation/performance/extract-rc3.py'
      - 'validation/performance/measure-rc3.ps1'
permissions:
  contents: read
  actions: read
jobs:
  packaged-performance:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Verify exact RC3 artifact and extract independently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path perf-evidence | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'aeris-rc3-perf.zip'
          $target = Join-Path $env:RUNNER_TEMP 'aeris-rc3-perf'
          $headers = @{Authorization=('Bearer ' + $env:GH_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri 'https://api.github.com/repos/Kgasil/aeris/actions/artifacts/15132444366/zip' -Headers $headers -OutFile $archive
          py -3.14-64 validation/performance/extract-rc3.py $archive $target | Set-Content -LiteralPath perf-evidence/integrity.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'RC3 verification failed' }
      - name: Measure RC3 startup, idle resources and normal shutdown
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\validation\performance\measure-rc3.ps1 -AerisExe (Join-Path $env:RUNNER_TEMP 'aeris-rc3-perf/Aeris/Aeris.exe') -ExpectedSha256 '94c329abe46a128719f8c951c7a8df2b8936d1550855089c9f0d25ed1cda37f5' -EvidencePath perf-evidence/packaged-performance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-rc3-performance-evidence
          path: perf-evidence/
          if-no-files-found: warn
          retention-days: 30
  posix-and-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.10'
          architecture: x64
      - name: Verify exact RC3 integrated source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rc3-review
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/Kgasil/aeris/actions/artifacts/15132444366/zip -o "$RUNNER_TEMP/rc3.zip"
          echo "de81221a8723a9c26f11db293e440c65243f4c4c53e8d2dd2d00afc0e94e270f  $RUNNER_TEMP/rc3.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/rc3.zip" security-evidence/Aeris-1.0.0rc3-integrated-source.zip > "$RUNNER_TEMP/rc3-source.zip"
          echo "a8a34378b5d1e0d7582c485edb27b002fe7ec239fa0c6e0b63e2bb5a37b03c6d  $RUNNER_TEMP/rc3-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/rc3-source.zip" -d rc3-source
      - name: Run four previously skipped tests in applicable environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-spa
          dpkg-query -W tesseract-ocr tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-spa > rc3-review/packages.txt
          cd rc3-source/desktop
          python -m unittest -v tests.test_lens.LensTests.test_real_ocr tests.test_protected_storage.StorageTests.test_no_plaintext_fallback tests.test_safe_input.SafeInputTests.test_fifo_rejected_before_open tests.test_vault.VaultTests.test_non_windows_fails_closed 2>&1 | tee "$GITHUB_WORKSPACE/rc3-review/previous-skips.log"
          grep -E '^Ran 4 tests' "$GITHUB_WORKSPACE/rc3-review/previous-skips.log"
          if grep -E 'skipped=' "$GITHUB_WORKSPACE/rc3-review/previous-skips.log"; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aeris-rc3-posix-ocr-review
          path: rc3-review/
          if-no-files-found: warn
          retention-days: 30
